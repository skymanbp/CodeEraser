# CodeEraser GUI shell (M6 S4a): a Tauri v2 window over the SAME
# library pipeline the CLI runs — the report document is produced by
# codeeraser::structure::judge::report_json, so there is exactly one
# report shape (design booklet §5). Deliberately OUTSIDE the cli
# package: the CI test lanes stay webview-free until the S4b
# packaging leg brings the platform deps.
[package]
name = "ce-gui"
version = "1.7.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# the OS folder picker behind the root field's browse button — the
# one dialog the shell opens (capabilities/default.json grants
# `dialog:allow-open` alone); under `withGlobalTauri` its script lands
# on window.__TAURI__.dialog beside core, no bundler involved
tauri-plugin-dialog = "2.7.3"
serde_json = "1"
# error type of the library faces judged() delegates to (M7-P4);
# already in this lockfile transitively via codeeraser
anyhow = "1"
codeeraser = { path = "../../cli" }
