<!doctype html>
<!-- CodeEraser GUI (M6 S4a structure screen + M7-P4 trend and
     deletion-candidate screens + M8-G3a i18n): renders the report
     documents and nothing else — no framework, no build step,
     judgment zero-leak into JS (webview layer is rendering glue by
     user ruling). Labels come from i18n.js (en default, zh switch);
     data-i18n marks every static label. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CodeEraser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <span id="brand"><img src="icon.png" alt="" />CodeEraser<span class="tm">.</span></span>
    <input id="root" type="text" spellcheck="false" />
    <nav id="tabs">
      <button class="tab on" data-tab="structure" data-i18n="tabStructure"></button>
      <button class="tab" data-tab="trend" data-i18n="tabTrend"></button>
      <button class="tab" data-tab="candidates" data-i18n="tabCandidates"></button>
    </nav>
    <button id="lang" title="English / 中文"></button>
    <span id="status"></span>
  </header>

  <div id="view-structure" class="view">
    <section class="bar">
      <label><input id="deep" type="checkbox" /> <span data-i18n="deep"></span></label>
      <label><span data-i18n="days"></span> <input id="days" type="number" min="1" data-i18n-ph="off" /></label>
      <button id="scan" data-i18n="scan"></button>
    </section>
    <section id="summary" hidden>
      <div class="stat"><span id="score"></span><small id="scale"></small></div>
      <div class="stat" id="entropy"></div>
      <div class="stat" id="axes"></div>
      <div class="stat" id="divergence"></div>
    </section>
    <main>
      <svg id="treemap" preserveAspectRatio="none"></svg>
      <aside id="detail"></aside>
      <div class="empty" id="empty-structure" data-i18n="emptyStructure"></div>
    </main>
  </div>

  <div id="view-trend" class="view" hidden>
    <section class="bar">
      <label><span data-i18n="commits"></span> <input id="trend-commits" type="number" min="2" value="30" /></label>
      <button id="trend-load" data-i18n="load"></button>
      <button id="trend-more" hidden></button>
    </section>
    <main>
      <svg id="trendchart" preserveAspectRatio="none"></svg>
      <aside id="trend-detail"></aside>
      <div class="empty" id="empty-trend" data-i18n="emptyTrend"></div>
    </main>
  </div>

  <div id="view-candidates" class="view" hidden>
    <section class="bar">
      <label><span data-i18n="days"></span> <input id="cand-days" type="number" min="1" value="14" /></label>
      <button id="cand-load" data-i18n="load"></button>
    </section>
    <main>
      <div id="cand-list"></div>
      <aside id="cand-detail"></aside>
      <div class="empty" id="empty-candidates" data-i18n="emptyCandidates"></div>
    </main>
  </div>

  <script src="i18n.js" defer></script>
  <script src="main.js" defer></script>
  <script src="trend.js" defer></script>
  <script src="candidates.js" defer></script>
</body>
</html>
