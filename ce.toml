# ce dogfood config (plan §7.5). Thresholds stay at the §4.1 defaults.

# Only the pinned THIRD-PARTY cross-check sources are exempt from this
# repo's own standards — they are test data measured by the acceptance
# harness. Everything else under contracts/ (hook capture script, docs,
# goldens) is ce-authored and stays scanned (attack-review narrowing).
exclude = ["contracts/fixtures/crosscheck/**"]

# Only-shrink clone ratchet (M2 review R12), enforced in CI via
# `ce dedup --check`. 209 measured 2026-08-07: the A9f batch tripped
# the gate at 213, and extracting the shared audit/precommit head
# (gather) plus two test helpers landed one below the old 210 floor —
# the gate has now caught its author on three consecutive landings.
# Remaining mass = test-fixture cluster + parallel test bodies
# (docs/FPR-REPLAY.md). Ratchet DOWN with every cleanup; never raise
# without a plan amendment.
[dedup]
budget = 209
