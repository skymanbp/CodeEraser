# ce dogfood config (plan §7.5). Thresholds stay at the §4.1 defaults.

# Only the pinned THIRD-PARTY cross-check sources are exempt from this
# repo's own standards — they are test data measured by the acceptance
# harness. Everything else under contracts/ (hook capture script, docs,
# goldens) is ce-authored and stays scanned (attack-review narrowing).
exclude = ["contracts/fixtures/crosscheck/**"]

# Only-shrink clone ratchet (M2 review R12), enforced in CI via
# `ce dedup --check`. 205 measured 2026-08-07 after src/hookio.rs
# unified the hook stdin intake + observe-feed writer (guard/audit/
# health envelope family, -4). Kept, not extracted: the three
# per-hook Envelope struct declarations + run_hook heads (4 blocks) —
# parallel contract declarations, same category as the parallel test
# bodies (docs/FPR-REPLAY.md). Remaining mass = test-fixture cluster.
# Ratchet DOWN with every cleanup; never raise without a plan
# amendment.
[dedup]
budget = 205
