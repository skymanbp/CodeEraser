# ce dogfood config (plan §7.5). Thresholds stay at the §4.1 defaults.

# Only the pinned THIRD-PARTY cross-check sources are exempt from this
# repo's own standards — they are test data measured by the acceptance
# harness. Everything else under contracts/ (hook capture script, docs,
# goldens) is ce-authored and stays scanned (attack-review narrowing).
exclude = ["contracts/fixtures/crosscheck/**"]

# Only-shrink clone ratchet (M2 review R12), enforced in CI via
# `ce dedup --check`. 202 measured 2026-08-07 after tests/common
# absorbed the tree-sitter parse harness (5th copy lived in the RCA
# harness; its 322-unit sweep re-run green after the switch).
# Kept, not extracted (named boundaries, docs/FPR-REPLAY.md):
# per-hook Envelope declarations (4 blocks, parallel contracts) and
# the metrics/divergence/sonar test bodies — documentary stance tests
# whose per-case whitepaper citations ARE the content; T2 folds their
# src literals so adjacent cases chain into one family (~150 blocks).
# Ratchet DOWN with every cleanup; never raise without a plan
# amendment.
[dedup]
budget = 202
