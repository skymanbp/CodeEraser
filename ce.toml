# ce dogfood config (plan §7.5). Thresholds stay at the §4.1 defaults.

# Only the pinned THIRD-PARTY cross-check sources are exempt from this
# repo's own standards — they are test data measured by the acceptance
# harness. Everything else under contracts/ (hook capture script, docs,
# goldens) is ce-authored and stays scanned (attack-review narrowing).
exclude = ["contracts/fixtures/crosscheck/**"]

# Declared layout (M6 S3a, design booklet §2 row A): the weights are
# this repo's own expectation of where its files live — cli carries
# the measurement half, core the judgment half, contracts the frozen
# wire, docs the reviews. "." is the catch-all bin (deepest-owner
# semantics), so the χ² divergence is always a number here and any
# drift shows up in `ce structure` as a moving per-mille.
[structure.layout]
"." = 2
"cli" = 8
"core" = 5
"contracts" = 2
"docs" = 2

# Deadcode liveness roots beyond the mechanical conventions (M5-2h).
# fixtures/ is test DATA measured by harnesses, not code with
# importers. The three #[path]-mounted *_tests.rs files that used to
# sit here were repaid at the mechanism (rs.rs mod_rung reads the
# attribute off the cached tree, GRAPH_REV 5) — exemptions retired,
# not renewed.
[graph]
entry_globs = [
    "contracts/fixtures/",
    # Skills are loaded by the Claude Code plugin runtime by path
    # convention (skills/<name>/SKILL.md) — liveness comes from the
    # external loader, never from an in-corpus reference edge.
    "plugin/skills/",
]

