<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img"
     aria-label="CodeEraser 方法学：泳道一度量事实（token 指纹 k=25 w=26、AST 树、引用图、git 窗口、LOC 多重集、文档 shingle），泳道二用精确的整数与有理数公式判决它们（winnowing 保证 t=50、TSED 85/100、Jaccard 80/100、软线 S=clamp(中位数×r^k,[200,500])、软区凸罚、存活性闭包、卡方散度、Theil-Sen 成对斜率中位数、分数折叠），泳道三按棘轮、dedup 预算、fail-under 地板、规则包围栏（整份解析 ce.toml 的 knobs 摘要）、来源守卫（被排除项藏起的基线文件）与 FPR 档位阶梯把门">
  <title>CodeEraser 方法学</title>
  <!-- Self-painted ground, same vocabulary as architecture.svg: the diagram
       carries its own dark panel so it reads identically on GitHub light/dark
       and on codeeraser.dev. Every number below is cited to a file:line in
       docs/reference/methodology/. -->
  <defs>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57c7a8"/>
    </marker>
    <marker id="m-verm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e4574a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="818" rx="18" fill="#10141d" stroke="#2a3347"/>

  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', 'Noto Sans SC', 'Microsoft YaHei', monospace">
    <text x="30" y="48" font-size="19" font-weight="600" fill="#f4efe6">CodeEraser——度量、判决、把门</text>
    <text x="30" y="70" font-size="11" fill="#8593ad">证据与判决之间没有模型 · 每条阈值都是整数或精确有理数比较 · 同一棵树进，同样的字节出</text>

    <!-- ===================== LANE 1 — MEASURE (Rust) ===================== -->
    <g>
      <rect x="28" y="100" width="316" height="638" rx="12" fill="#1e2534" stroke="#2a3347"/>
      <rect x="28" y="100" width="4" height="638" rx="2" fill="#d9a35b"/>
      <text x="48" y="130" font-size="13" font-weight="600" fill="#d9a35b">1 · 实测事实</text>
      <text x="328" y="130" font-size="10" letter-spacing="1.5" fill="#8593ad" text-anchor="end">RUST</text>

      <g fill="#171c28" stroke="#2a3347">
        <rect x="44" y="146" width="284" height="78" rx="8"/>
        <rect x="44" y="242" width="284" height="78" rx="8"/>
        <rect x="44" y="338" width="284" height="78" rx="8"/>
        <rect x="44" y="434" width="284" height="78" rx="8"/>
        <rect x="44" y="530" width="284" height="78" rx="8"/>
        <rect x="44" y="626" width="284" height="78" rx="8"/>
      </g>

      <g font-size="11.5" fill="#cdd6e4">
        <text x="58" y="168">token 指纹</text>
        <text x="58" y="264">AST 树，后序</text>
        <text x="58" y="360">引用图</text>
        <text x="58" y="456">git 窗口</text>
        <text x="58" y="552">LOC 多重集</text>
        <text x="58" y="648">文档 shingle</text>
      </g>
      <g font-size="9.5" fill="#8593ad">
        <text x="58" y="186">k-gram k = 25，窗口 w = 26</text>
        <text x="58" y="204">FNV-1a 叶哈希，BASE = 1 000 003</text>

        <text x="58" y="282">lab[i] 种类码，lld[i] 最左叶</text>
        <text x="58" y="300">至少 24 个具名节点，单元上限 256</text>

        <text x="58" y="378">冻结的站点种类，阶梯 1..5 级</text>
        <text x="58" y="396">保留弧按 (src, dst) 去重</text>

        <text x="58" y="474">逐单元的追加 / 重写行数</text>
        <text x="58" y="492">共变对；缝窗 14 天</text>

        <text x="58" y="570">判决语言文件的 LOC 值</text>
        <text x="58" y="588">中位数 m，乘性 MAD r</text>

        <text x="58" y="666">词 5-gram，地板 50 词</text>
        <text x="58" y="684">MinHash 128 置换，32 带 × 4 行</text>
      </g>
    </g>

    <!-- ===================== LANE 2 — JUDGE (Haskell) ===================== -->
    <g>
      <rect x="392" y="100" width="416" height="638" rx="12" fill="#1e2534" stroke="#2a3347"/>
      <rect x="392" y="100" width="4" height="638" rx="2" fill="#e4574a"/>
      <text x="412" y="130" font-size="13" font-weight="600" fill="#e4574a">2 · 判决计算</text>
      <text x="792" y="130" font-size="10" letter-spacing="1.5" fill="#8593ad" text-anchor="end">HASKELL</text>

      <g fill="#171c28" stroke="#2a3347">
        <rect x="408" y="146" width="384" height="56" rx="8"/>
        <rect x="408" y="210" width="384" height="56" rx="8"/>
        <rect x="408" y="274" width="384" height="56" rx="8"/>
        <rect x="408" y="338" width="384" height="56" rx="8"/>
        <rect x="408" y="402" width="384" height="56" rx="8"/>
        <rect x="408" y="466" width="384" height="56" rx="8"/>
        <rect x="408" y="530" width="384" height="56" rx="8"/>
        <rect x="408" y="594" width="384" height="56" rx="8"/>
        <rect x="408" y="658" width="384" height="56" rx="8"/>
      </g>

      <g font-size="11" fill="#cdd6e4">
        <text x="422" y="167">winnowing 不漏保证</text>
        <text x="422" y="231">T3 克隆判决——TSED</text>
        <text x="422" y="295">文档重复——精确 Jaccard</text>
        <text x="422" y="359">软线，按仓库</text>
        <text x="422" y="423">尺寸罚——凸软区</text>
        <text x="422" y="487">死码存活性</text>
        <text x="422" y="551">结构熵与散度</text>
        <text x="422" y="615">分数轨迹——Theil-Sen</text>
        <text x="422" y="679">折叠——一个 0..1000 分数</text>
      </g>
      <g font-size="10.5" fill="#57c7a8">
        <text x="422" y="187">t = window + kgram - 1 = 26 + 25 - 1 = 50</text>
        <text x="422" y="251">(max(n1,n2) - ted) * 100 &gt;= 85 * max(n1,n2)</text>
        <text x="422" y="315">inter * 100 &gt;= 80 * union  ||  run &gt;= 50 词</text>
        <text x="422" y="379">S = clamp(floor(m * r^k), [200, 500]),  k = 2</text>
        <text x="422" y="443">p(x) = 10 * ((x - S) / (750 - S))^2，S &lt; x &lt;= 750；750 以上线性</text>
        <text x="422" y="507">reach = 自 flags .&amp;. 126 != 0 出发的闭包</text>
        <text x="422" y="571">1 - sum (c/N)^2   ·   sum (p - q)^2 / q</text>
        <text x="422" y="635">slope = median { (sj - si) / (tj - ti) }</text>
        <text x="422" y="699">max 0 (1000 - sum(w*p*10) `div` (10 * sum(w)))</text>
      </g>
    </g>

    <!-- ===================== LANE 3 — GATE ===================== -->
    <g>
      <rect x="856" y="100" width="316" height="638" rx="12" fill="#1e2534" stroke="#2a3347"/>
      <rect x="856" y="100" width="4" height="638" rx="2" fill="#57c7a8"/>
      <text x="876" y="130" font-size="13" font-weight="600" fill="#57c7a8">3 · 门</text>
      <text x="1156" y="130" font-size="10" letter-spacing="1.5" fill="#8593ad" text-anchor="end">退出码</text>

      <g fill="#171c28" stroke="#2a3347">
        <rect x="872" y="146" width="284" height="76" rx="8"/>
        <rect x="872" y="236" width="284" height="76" rx="8"/>
        <rect x="872" y="326" width="284" height="76" rx="8"/>
        <rect x="872" y="416" width="284" height="76" rx="8"/>
        <rect x="872" y="506" width="284" height="76" rx="8"/>
        <rect x="872" y="596" width="284" height="76" rx="8"/>
      </g>

      <g font-size="11.5" fill="#cdd6e4">
        <text x="886" y="167">ADR-006 连续棘轮</text>
        <text x="886" y="257">离散棘轮</text>
        <text x="886" y="347">dedup 预算</text>
        <text x="886" y="437">--fail-under 地板</text>
        <text x="886" y="527">规则包围栏 · 来源</text>
        <text x="886" y="617">守卫档位阶梯</text>
      </g>
      <g font-size="9.5" fill="#8593ad">
        <text x="886" y="185">tolerated(c) = max(c*102 div 100, c + 10)</text>
        <text x="886" y="201">v &gt; tolerated(bv)  =&gt;  ratchet_over</text>
        <text x="886" y="217">新上限 = min(v, bv)；两腿在 500 交叉</text>

        <text x="886" y="275">added = 当前 \ 基线</text>
        <text x="886" y="291">非空  =&gt;  discrete_added</text>
        <text x="886" y="307">removed = 基线 \ 当前，只会收缩</text>

        <text x="886" y="365">块数 &gt; 预算  =&gt;  dedup_budget</text>
        <text x="886" y="381">只降不升；由 ce dedup --check 发出</text>
        <text x="886" y="397">缺席的数对 = 该轴不判</text>

        <text x="886" y="455">score &lt; reqFloor  =&gt;  floor</text>
        <text x="886" y="471">ce check . --fail-under 946</text>
        <text x="886" y="487">exit 1 把流水线判红</text>

        <text x="886" y="545">ce.toml 摘要 /= 基线  =&gt;  knobs_digest</text>
        <text x="886" y="561">基线里的文件被藏起  =&gt;  rows_dropped</text>
        <text x="886" y="577">改了 ce.toml 就得具名重立</text>

        <text x="886" y="635">observe -&gt; warn -&gt; ask -&gt; deny</text>
        <text x="886" y="651">deny 准入 = FPR &lt;= 1% / 500 次编辑</text>
        <text x="886" y="667">无 FPR 记录  =&gt;  停在 observe</text>
      </g>
    </g>

    <!-- ===================== FLOW ===================== -->
    <g stroke-width="1.6" fill="none">
      <path d="M344 419 H386" stroke="#57c7a8" marker-end="url(#m-teal)"/>
      <path d="M808 419 H850" stroke="#e4574a" marker-end="url(#m-verm)"/>
    </g>
    <text x="365" y="408" font-size="9" fill="#8593ad" text-anchor="middle">事实</text>
    <text x="829" y="408" font-size="9" fill="#8593ad" text-anchor="middle">判决</text>

    <text x="600" y="772" font-size="10.5" fill="#8593ad" text-anchor="middle">fail = ratchet_over || discrete_added || floor || dedup_budget || knobs_digest || rows_dropped——六个具名条件，回包会说明哪几个成立</text>
    <text x="600" y="792" font-size="10.5" fill="#8593ad" text-anchor="middle">判决层没有浮点数：每个比值都交叉相乘，每个次序统计量都是精确 Rational</text>
  </g>
</svg>
