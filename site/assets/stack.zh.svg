        <text x="64" y="974">终端</text>
        <text x="280" y="974">Tauri GUI</text>
        <text x="496" y="974">只读 MCP</text>
        <text x="712" y="974">Claude Code hooks</text>
        <text x="928" y="974">CI 门</text>
      </g>
      <g font-size="9.5" fill="#8593ad">
        <text x="64" y="994">控制台 · JSON · SARIF</text>
        <text x="64" y="1010">英文 / 中文行</text>
        <text x="280" y="994">十个屏</text>
        <text x="280" y="1010">只做渲染</text>
        <text x="496" y="994">报告工具</text>
        <text x="496" y="1010">不写基线</text>
        <text x="712" y="994">PreToolUse · Stop</text>
        <text x="712" y="1010">SessionStart 健康</text>
        <text x="928" y="994">通过 · 违规 · 内部错误</text>
        <text x="928" y="1010">棘轮 + 显式地板 946</text>
      </g>

      <line x1="48" y1="1050" x2="1132" y2="1050" stroke="#2a3347"/>
      <text x="590" y="1073" text-anchor="middle" font-size="10.5" fill="#d9a35b">每个发布资产之下的信任链：draft 字节 → SHA256SUMS → 提交的 pins → tag 只校验、永不重建</text>
    </g>
  </g>
