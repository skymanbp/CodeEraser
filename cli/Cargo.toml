[package]
name = "ce"
version = "0.0.1"
edition = "2024"
description = "CodeEraser CLI — erase LLM-induced code & document entropy"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
