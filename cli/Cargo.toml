[package]
# crates.io name `ce` is squatted (2021, no bin); ripgrep pattern instead:
# package `codeeraser`, binary `ce` (name-check 2026-08-07, cc-memory decision)
name = "codeeraser"
version = "0.0.1"
edition = "2024"
description = "CodeEraser — erase LLM-induced code & document entropy"
license = "Apache-2.0"

[[bin]]
name = "ce"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
ignore = "0.4.33"
# 0.38+ pulls libsqlite3-sys 0.38 whose build.rs needs unstable
# cfg_select! — incompatible with the pinned Rust 1.94.1 toolchain
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[profile.release]
strip = true

[dev-dependencies]
proptest = "1.11.0"
