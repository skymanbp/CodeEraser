[package]
# crates.io name `ce` is squatted (2021, no bin); ripgrep pattern instead:
# package `codeeraser`, binary `ce` (name-check 2026-08-07, cc-memory decision)
name = "codeeraser"
version = "1.2.0"
edition = "2024"
description = "CodeEraser — erase LLM-induced code & document entropy"
license = "Apache-2.0"
repository = "https://github.com/skymanbp/CodeEraser"
# cargo-package tarball only (git/CI untouched): the integration tests
# lean on repo-root contracts/ fixtures that never ship in the crate,
# so for `cargo install` users they were 124 files of dead weight
# (user decision 2026-08-26; measured via `cargo package --list`).
exclude = ["tests/"]

[[bin]]
name = "ce"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
# daemon token entropy (auth.rs) — already in the tree transitively,
# so this adds no new build node
getrandom = "0.3"
ignore = "0.4.33"
interprocess = "2.4.3"
# 0.38+ pulls libsqlite3-sys 0.38 whose build.rs needs unstable
# cfg_select! — incompatible with the pinned Rust 1.94.1 toolchain
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
# 3k spike (2026-08-14): 0.23.1 loads under core 0.26 — the ABI pin
# lives in tests/hs_grammar_pin.rs, red if an upgrade breaks it
tree-sitter-haskell = "0.23.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
# docdup word hashing: NFC + General_Category=Mark test, so canonically
# equivalent prose cannot hash two ways (docdup/shingle.rs)
unicode-normalization = "0.1.25"

[profile.release]
strip = true

[dev-dependencies]
proptest = "1.11.0"
# eval-set freeze manifest hashing (tests/eval_extract, M4 D2-1) —
# dev-only so the product binary carries no digest dependency
sha2 = "0.10"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
