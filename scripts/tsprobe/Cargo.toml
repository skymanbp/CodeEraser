# AST probe behind docs/reference/language-expansion.md §10 and
# docs/reference/analysis-track.md §5.3. A standalone crate on purpose:
# it is not a workspace member, ships nowhere, and its Cargo.lock is
# untracked (see .gitignore here) — the ten grammar pins below, each the
# version cli/Cargo.lock resolves, are the reproducibility contract.
[package]
name = "tsprobe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tree-sitter = "=0.27.0"
tree-sitter-language = "0.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-lua = "=0.5.0"
tree-sitter-java = "=0.23.5"
tree-sitter-r = "=1.3.0"
tree-sitter-html = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-go = "=0.25.0"
