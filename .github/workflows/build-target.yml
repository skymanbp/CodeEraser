# One release target's build (plan v2.29 step 10, O70): ce + ce-core +
# the GUI bundle carrying both as sidecars, staged under dist/ by the
# versioned asset names scripts/roster.js spells, uploaded when asked.
# Called by release.yml's build matrix (upload: true) and by ci.yml's
# weekly release-rehearsal (upload: false) — ONE recipe, so a rehearsal
# that passes is the release build that will pass, on the runner image
# the release will use (the v1.3.0 lesson: a target first exercised on
# the tag fails on the tag).
name: build-target

on:
  workflow_call:
    inputs:
      os:
        description: "runs-on label: windows-latest, ubuntu-22.04, macos-latest, macos-15-intel, ubuntu-22.04-arm"
        type: string
        required: true
      key:
        description: "roster key <arch>-<os> (update::version::TARGETS)"
        type: string
        required: true
      triple:
        description: "Rust target triple — the sidecar file names tauri expects"
        type: string
        required: true
      ext:
        description: "binary suffix: .exe on Windows, empty elsewhere"
        type: string
        default: ""
      version:
        description: "version to stage under; empty = the crate's own (rehearsal), a value must equal cli/Cargo.toml (release)"
        type: string
        default: ""
      upload:
        description: "upload dist/* as the artifact dist-<key>"
        type: boolean
        default: false

# The build compiles third-party build.rs / Setup.hs and needs no write
# at all (2026-08-19 review) — read-only, whatever the caller holds.
permissions:
  contents: read

# linuxdeploy's AppRun launcher as tauri-bundler downloads it
# (binary-releases tag apprun-old), one sha256 per linux arch; the seed
# step and the AppImage mode gate below both read these two, nowhere
# else. x86_64 is byte-identical to 1.8.0's shipped AppRun.wrapped.
env:
  APPRUN_SHA256_X86_64: f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
  APPRUN_SHA256_AARCH64: 072f17c0895a85c490282fe5395c5007e5fc75da727e553b3b8fb680feb11578
  # the highest glibc symbol version a Linux binary may ask for: the
  # same number docs/RELEASE.md states, so when a runner moves to a
  # newer image the glibc step below goes red before users do
  GLIBC_FLOOR: "2.35"

jobs:
  build-target:
    runs-on: ${{ inputs.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      TARGET_KEY: ${{ inputs.key }}
      TARGET_TRIPLE: ${{ inputs.triple }}
      TARGET_EXT: ${{ inputs.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the version has ONE source — cli/Cargo.toml. v0.1.0 shipped
      # binaries reporting 0.0.1 because the input was free text; now a
      # mismatch fails before any platform builds. The rehearsal passes
      # no version and stages under the crate's own.
      - name: Version input must match the crate
        shell: bash
        run: |
          # the input is bound through env, never spliced into this
          # script's source: a curly-brace expression substitutes
          # BEFORE bash parses, so a value carrying a quote and a
          # command substitution would execute here
          CRATE=$(grep -m1 '^version' cli/Cargo.toml | cut -d'"' -f2)
          if [ -z "$RELEASE_VERSION" ]; then
            echo "RELEASE_VERSION=$CRATE" >> "$GITHUB_ENV"
            echo "rehearsal: staging under the crate's own $CRATE"
            exit 0
          fi
          case "$RELEASE_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version input must be N.N.N, got: $RELEASE_VERSION"; exit 1 ;;
          esac
          [ "$CRATE" = "$RELEASE_VERSION" ] || {
            echo "input $RELEASE_VERSION != cli/Cargo.toml $CRATE"; exit 1; }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-19; version comes from rust-toolchain.toml (repo root, both workspaces)
      # every cache below is keyed by the runner label too: objects built
      # on another image (a 24.04 GHC bindist, C code compiled against
      # glibc 2.39 headers, a ce-core cabal reports up to date) would
      # carry that image's glibc floor into this build
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ inputs.os }}
          workspaces: |
            cli
            gui/src-tauri
      - name: GUI system deps (ubuntu)
        if: startsWith(inputs.os, 'ubuntu')
        # Same apt armor as ci.yml (see the full why there): mirrorlist
        # pinned off the black-holing azure mirror, per-try timeout(1)
        # so retries actually cycle, step timeout as the hard floor.
        # The sleep is retry backoff, not race masking. x86_64 packages
        # live on archive.ubuntu.com, arm64 (the O70 runner) on ports —
        # the pin must follow the runner's own architecture.
        timeout-minutes: 15
        run: |
          case "$(dpkg --print-architecture)" in
            arm64) echo 'https://ports.ubuntu.com/ubuntu-ports/' ;;
            *) echo 'https://archive.ubuntu.com/ubuntu/' ;;
          esac | sudo tee /etc/apt/apt-mirrors.txt
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          ok=""
          for i in 1 2 3; do
            if timeout 120 sudo apt-get $APT update && timeout 420 sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev; then ok=1; break; fi
            echo "apt attempt $i failed; backing off" && sleep 10
          done
          [ -n "$ok" ]
      # ce-core ships beside ce from v0.2.0 — the judgment layer stops
      # being source-install-only (the release face's biggest UX gap).
      # The freeze file pins the build plan, so the cache key is honest.
      # Every non-Windows image here ships no preinstalled 9.14.1 (the
      # macOS images never did, the arm image ships no GHC), so without
      # this cache every build re-downloads GHC from downloads.haskell.org
      # (the 2026-08-19 outage lesson, see ci.yml build-macos).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os != 'Windows'
        with:
          path: ~/.ghcup
          key: ghcup-${{ inputs.key }}-${{ inputs.os }}-ghc9.14.1
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          ghc-version: "9.14.1"
      - name: Cabal store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cabal/store
            core/dist-newstyle
          key: cecore-${{ inputs.key }}-${{ inputs.os }}-${{ hashFiles('core/cabal.project.freeze') }}
      - name: Build ce-core (release)
        shell: bash
        working-directory: core
        run: |
          cabal update
          cabal build exe:ce-core
      - name: Build ce (release)
        shell: bash
        working-directory: cli
        run: cargo build --release --locked
      # tauri-cli compiles from source (~minutes) — acceptable at
      # release cadence; rust-cache does not cover cargo install.
      # EXACT version: '^2' floated whatever crates.io served that
      # day into the release toolchain (--locked honours tauri-cli's
      # own lockfile, not its version). Bump deliberately.
      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --version 2.11.4 --locked
      # the installer carries all three binaries (v0.2.0 formalization):
      # externalBin sidecars land in the app dir, which is exactly
      # where ce's ce-core sibling resolution probes
      - name: Stage sidecar binaries for the bundle
        shell: bash
        run: |
          mkdir -p gui/src-tauri/binaries
          cp "cli/target/release/ce$TARGET_EXT" \
             "gui/src-tauri/binaries/ce-$TARGET_TRIPLE$TARGET_EXT"
          CORE=$(cd core && cabal list-bin ce-core)
          cp "$CORE" "gui/src-tauri/binaries/ce-core-$TARGET_TRIPLE$TARGET_EXT"
      # tauri-bundler 2.9.4 (tauri-cli 2.11.4) downloads the AppRun
      # launcher into its tool cache (dirs::cache_dir()/tauri) only when
      # the cached file is ABSENT (linuxdeploy.rs::prepare_tools), and
      # writes it 0770 (appimage/mod.rs:22 write_and_make_executable);
      # fs::copy keeps that mode in the AppDir, where the GTK plugin
      # renames it AppRun.wrapped - so 1.8.0's AppImage refused every
      # non-root user (tauri-apps/tauri#16155; AppImage directory
      # submission #8967). tauri-bundler 2.10.0's source still writes
      # 0770, so an upgrade does not fix it: this step puts the pinned
      # launcher in the cache at 0755 and the bundler reads that copy.
      - name: Seed the AppImage launcher at 0755
        if: endsWith(inputs.key, '-linux')
        shell: bash
        run: |
          ARCH="${TARGET_TRIPLE%%-*}"
          case "$ARCH" in
            x86_64) WANT="$APPRUN_SHA256_X86_64" ;;
            aarch64) WANT="$APPRUN_SHA256_AARCH64" ;;
            *) echo "no pinned AppRun sha256 for $ARCH"; exit 1 ;;
          esac
          echo "APPRUN_SHA256=$WANT" >> "$GITHUB_ENV"
          # essential location, because it is where tauri-bundler looks:
          # dirs::cache_dir() on Linux, joined with tauri
          DIR="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          F="$DIR/AppRun-$ARCH"
          mkdir -p "$DIR"
          curl -fsSL -o "$F" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-$ARCH"
          echo "$WANT  $F" | sha256sum -c - || {
            echo "pinned $WANT"; echo "got    $(sha256sum "$F" | cut -d' ' -f1)"; exit 1; }
          chmod 0755 "$F"
          ls -l "$F"
      # externalBin is injected HERE, not in tauri.conf.json:
      # tauri-build validates the sidecar files at COMPILE time, so a
      # static declaration would break every compile gate that has no
      # staged binaries (probed locally 2026-08-18) — bundling config
      # lives with the one pipeline that stages the bundle.
      # --verbose: tauri-bundler prints bundle_dmg.sh's output only at
      # debug level, so the one DMG failure seen so far (run 34021025544
      # attempt 1, macos-15-intel, green on rerun) left no first-hand
      # line to diagnose. `-- --locked` reaches the cargo build the
      # runner performs. The retry is bounded to one and names itself:
      # a second failure is a real failure, not a flake.
      - name: Build GUI bundle (with sidecars)
        shell: bash
        working-directory: gui/src-tauri
        run: |
          for attempt in 1 2; do
            cargo tauri build --verbose --config \
              '{"bundle":{"externalBin":["binaries/ce","binaries/ce-core"]}}' \
              -- --locked && break
            [ "$attempt" = 1 ] || exit 1
            echo "::warning::cargo tauri build failed on attempt $attempt; retrying once (DMG bundling flaked on run 34021025544 attempt 1)"
          done
      # the launcher's mode as the user receives it: the type-2 runtime
      # extracts itself (no FUSE on the runner) and every file that only
      # its owner may run or that others may not read is named
      - name: Check the AppImage's file modes
        if: endsWith(inputs.key, '-linux')
        shell: bash
        run: |
          set -- "$GITHUB_WORKSPACE"/gui/src-tauri/target/release/bundle/appimage/*.AppImage
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one AppImage, found $#: $*"; exit 1; }
          A="$1"
          chmod +x "$A"
          cd "$(mktemp -d)"
          "$A" --appimage-extract >/dev/null
          S=squashfs-root
          echo "APPIMAGE_ROOT=$PWD/$S" >> "$GITHUB_ENV"
          fail() { echo "::error::$1"; ls -l "$S"; exit 1; }
          for f in AppRun.wrapped AppRun; do
            m=$(stat -c %a "$S/$f")
            [ "$m" = 755 ] || fail "$f mode $m, want 755"
          done
          got=$(sha256sum "$S/AppRun.wrapped" | cut -d' ' -f1)
          [ "$got" = "$APPRUN_SHA256" ] || fail "AppRun.wrapped sha256 $got, pinned $APPRUN_SHA256"
          owner_only=$(find "$S" -type f -perm -u+x ! -perm -o+x)
          [ -z "$owner_only" ] || fail "executable by the owner only: $owner_only"
          unreadable=$(find "$S" -type f ! -perm -o+r)
          [ -z "$unreadable" ] || fail "not readable by others: $unreadable"
          echo "AppImage modes ok: launcher 755, sha256 $got"
      # the glibc floor, held on the three binaries a Linux user runs:
      # ce and ce-core as built above, and the GUI binary as the
      # AppImage carries it (the only file in usr/bin besides the two
      # sidecars). A binary missing or with no GLIBC_ symbol at all is a
      # failure, not a pass.
      - name: Check the glibc floor of the Linux binaries
        if: endsWith(inputs.key, '-linux')
        shell: bash
        run: |
          CORE=$(cd core && cabal list-bin ce-core)
          GUI=$(find "$APPIMAGE_ROOT/usr/bin" -maxdepth 1 -type f ! -name ce ! -name ce-core)
          if [ -z "$GUI" ] || [ "$(printf '%s\n' "$GUI" | wc -l)" -ne 1 ]; then
            echo "expected one GUI binary in usr/bin besides ce and ce-core, found: ${GUI:-none}"
            ls -l "$APPIMAGE_ROOT/usr/bin"; exit 1
          fi
          bad=0
          for b in "cli/target/release/ce" "$CORE" "$GUI"; do
            [ -f "$b" ] || { echo "::error::missing $b"; bad=1; continue; }
            top=$(objdump -T "$b" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1) || true
            [ -n "$top" ] || { echo "::error::$b: no GLIBC_ symbols"; bad=1; continue; }
            echo "$b: $top"
            last=$(printf '%s\n' "GLIBC_$GLIBC_FLOOR" "$top" | sort -V | tail -1)
            [ "$last" = "GLIBC_$GLIBC_FLOOR" ] || { echo "::error::$b needs $top, above the floor GLIBC_$GLIBC_FLOOR"; bad=1; }
          done
          exit "$bad"
      # the asset names scripts/roster.js derives: <what>-<ver>-<key><ext>
      # for the binaries, CodeEraser-<ver>-<key><bundle> for the installer
      # whose kind follows the key's os half
      - name: Stage versioned artifacts
        shell: bash
        run: |
          VER="$RELEASE_VERSION"
          [ -n "$VER" ] || { echo "RELEASE_VERSION did not survive GITHUB_ENV"; exit 1; }
          mkdir -p dist
          cp "cli/target/release/ce$TARGET_EXT" "dist/ce-$VER-$TARGET_KEY$TARGET_EXT"
          CORE=$(cd core && cabal list-bin ce-core)
          cp "$CORE" "dist/ce-core-$VER-$TARGET_KEY$TARGET_EXT"
          case "$TARGET_KEY" in
            *-windows)
              cp gui/src-tauri/target/release/bundle/nsis/*-setup.exe \
                 "dist/CodeEraser-$VER-$TARGET_KEY-setup.exe" ;;
            *-linux)
              cp gui/src-tauri/target/release/bundle/appimage/*.AppImage \
                 "dist/CodeEraser-$VER-$TARGET_KEY.AppImage" ;;
            *-macos)
              cp gui/src-tauri/target/release/bundle/dmg/*.dmg \
                 "dist/CodeEraser-$VER-$TARGET_KEY.dmg" ;;
            *) echo "roster key $TARGET_KEY names no bundle kind"; exit 1 ;;
          esac
          ls -l dist
          # not `ls | wc -l`: BSD wc (both macOS legs) pads its count with
          # leading blanks, so a string test against 3 is false on a
          # perfectly good build; the shell counts its own globs
          set -- dist/*
          [ "$#" -eq 3 ] || { echo "expected three staged assets, staged $#: $*"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.upload
        with:
          name: dist-${{ inputs.key }}
          path: dist/*
          if-no-files-found: error
