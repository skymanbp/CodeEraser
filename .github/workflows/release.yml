# Release automation (M7-P1, ADR-007). Two-phase by design
# (docs/reviews/2026-08-17-m7-release-track.md P1): a manual
# workflow_dispatch builds the three platforms and uploads DRAFT
# assets + SHA256SUMS; the measured hashes then land in
# plugin/bin/manifest.env as a commit; only then the v* tag is cut,
# whose job re-downloads the SAME draft assets (no rebuild — Rust and
# GHC builds are not bit-reproducible across runs, so a rebuild would
# invalidate honest pins), verifies every pin, and publishes.
# macOS 10x billing (D2-8) is fine here: releases are rare and
# explicitly human-triggered.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to draft (e.g. 0.1.0, no leading v)"
        required: true
  push:
    tags: ["v*"]

# Least privilege per job (2026-08-19 review): the workflow-level
# write handed a release-editing token to the BUILD job too — which
# compiles third-party build.rs/Setup.hs and needs no write at all.
# Only the two jobs that touch the release carry it.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            key: x86_64-windows
            triple: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            key: x86_64-linux
            triple: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            key: aarch64-macos
            triple: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # the version has ONE source — cli/Cargo.toml. v0.1.0 shipped
      # binaries reporting 0.0.1 because the input was free text;
      # now a mismatch fails before any platform builds.
      - name: Version input must match the crate
        shell: bash
        run: |
          CRATE=$(grep -m1 '^version' cli/Cargo.toml | cut -d'"' -f2)
          [ "$CRATE" = "${{ inputs.version }}" ] || {
            echo "input ${{ inputs.version }} != cli/Cargo.toml $CRATE"; exit 1; }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-19; version comes from cli/rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            gui/src-tauri
      - name: GUI system deps (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        # Same apt armor as ci.yml (see the full why there): mirrorlist
        # pinned off the black-holing azure mirror, per-try timeout(1)
        # so retries actually cycle, step timeout as the hard floor.
        # The sleep is retry backoff, not race masking.
        timeout-minutes: 15
        run: |
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          ok=""
          for i in 1 2 3; do
            if timeout 120 sudo apt-get $APT update && timeout 420 sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev; then ok=1; break; fi
            echo "apt attempt $i failed; backing off" && sleep 10
          done
          [ -n "$ok" ]
      # ce-core ships beside ce from v0.2.0 — the judgment layer stops
      # being source-install-only (the release face's biggest UX gap).
      # The freeze file pins the build plan, so the cache key is honest.
      # macOS only: the runner image ships no preinstalled 9.14.1, so
      # without this cache every release build re-downloads GHC from
      # downloads.haskell.org (the 2026-08-19 outage lesson, see
      # ci.yml build-macos for the full why).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.os == 'macos-latest'
        with:
          path: ~/.ghcup
          key: ghcup-macos-ghc9.14.1
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          ghc-version: "9.14.1"
      - name: Cabal store cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cabal/store
            core/dist-newstyle
          key: cecore-${{ matrix.key }}-${{ hashFiles('core/cabal.project.freeze') }}
      - name: Build ce-core (release)
        shell: bash
        working-directory: core
        run: |
          cabal update
          cabal build exe:ce-core
      - name: Build ce (release)
        shell: bash
        working-directory: cli
        run: cargo build --release --locked
      # tauri-cli compiles from source (~minutes) — acceptable at
      # release cadence; rust-cache does not cover cargo install.
      # EXACT version: '^2' floated whatever crates.io served that
      # day into the release toolchain (--locked honours tauri-cli's
      # own lockfile, not its version). Bump deliberately.
      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --version 2.11.4 --locked
      # the installer carries all three binaries (v0.2.0 formalization):
      # externalBin sidecars land in the app dir, which is exactly
      # where ce's ce-core sibling resolution probes
      - name: Stage sidecar binaries for the bundle
        shell: bash
        run: |
          mkdir -p gui/src-tauri/binaries
          cp "cli/target/release/ce${{ matrix.ext }}" \
             "gui/src-tauri/binaries/ce-${{ matrix.triple }}${{ matrix.ext }}"
          CORE=$(cd core && cabal list-bin ce-core)
          cp "$CORE" "gui/src-tauri/binaries/ce-core-${{ matrix.triple }}${{ matrix.ext }}"
      # externalBin is injected HERE, not in tauri.conf.json:
      # tauri-build validates the sidecar files at COMPILE time, so a
      # static declaration would break every compile gate that has no
      # staged binaries (probed locally 2026-08-18) — bundling config
      # lives with the one pipeline that stages the bundle.
      - name: Build GUI bundle (with sidecars)
        shell: bash
        working-directory: gui/src-tauri
        run: |
          cargo tauri build --config \
            '{"bundle":{"externalBin":["binaries/ce","binaries/ce-core"]}}'
      - name: Stage versioned artifacts
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          KEY="${{ matrix.key }}"
          EXT="${{ matrix.ext }}"
          mkdir -p dist
          cp "cli/target/release/ce$EXT" "dist/ce-$VER-$KEY$EXT"
          CORE=$(cd core && cabal list-bin ce-core)
          cp "$CORE" "dist/ce-core-$VER-$KEY$EXT"
          case "$KEY" in
            x86_64-windows)
              cp gui/src-tauri/target/release/bundle/nsis/*-setup.exe \
                 "dist/CodeEraser-$VER-$KEY-setup.exe" ;;
            x86_64-linux)
              cp gui/src-tauri/target/release/bundle/appimage/*.AppImage \
                 "dist/CodeEraser-$VER-$KEY.AppImage" ;;
            aarch64-macos)
              cp gui/src-tauri/target/release/bundle/dmg/*.dmg \
                 "dist/CodeEraser-$VER-$KEY.dmg" ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.key }}
          path: dist/*
          if-no-files-found: error

  draft:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums + draft release
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" dist/* --clobber
          else
            gh release create "v$VER" --draft \
              --title "CodeEraser $VER" \
              --notes "Draft build phase (M7-P1). Unsigned binaries — verify SHA256SUMS; pins land in plugin/bin/manifest.env before the tag publishes this release." \
              dist/*
          fi

  verify-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release download/edit
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify draft assets against manifest pins, then publish
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          . plugin/bin/manifest.env
          [ "$CE_MANIFEST_VERSION" = "$VER" ] || {
            echo "manifest version $CE_MANIFEST_VERSION != tag $VER"; exit 1; }
          mkdir dist && cd dist
          gh release download "$TAG" --pattern '*'
          sha256sum -c SHA256SUMS
          check_pin() { # $1=envkey tail (PLATFORM_CE | PLATFORM_CECORE) $2=filename
            eval "pin=\${CE_SHA256_$1:-}"
            [ -n "$pin" ] || { echo "pin $1 is EMPTY — tag phase requires complete pins"; exit 1; }
            got=$(sha256sum "$2" | cut -d' ' -f1)
            [ "$got" = "$pin" ] || { echo "pin $1 mismatch: expected $pin got $got"; exit 1; }
            echo "pin $1 ok"
          }
          check_pin X86_64_WINDOWS_CE "ce-$VER-x86_64-windows.exe"
          check_pin X86_64_LINUX_CE "ce-$VER-x86_64-linux"
          check_pin AARCH64_MACOS_CE "ce-$VER-aarch64-macos"
          check_pin X86_64_WINDOWS_CECORE "ce-core-$VER-x86_64-windows.exe"
          check_pin X86_64_LINUX_CECORE "ce-core-$VER-x86_64-linux"
          check_pin AARCH64_MACOS_CECORE "ce-core-$VER-aarch64-macos"
          gh release edit "$TAG" --draft=false
