# CI per DEVELOPMENT_PLAN.md §6 M0. Private-repo billing (D2-8):
# macOS is 10x-metered, so it runs only on tags and the weekly schedule.
name: ci

# CI never writes anything back — said explicitly so the token the
# third-party build scripts see is read-only whatever the repo default.
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly macOS coverage

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # graph_provenance.rs asserts sample -> audit -> resolver
          # commit ancestry (design G13); a shallow clone has no
          # ancestry to check and the test refuses it loudly
          fetch-depth: 0

      # Haskell first: the Rust test step consumes the built ce-core
      # via CE_CORE_BIN (cross-language wire goldens) — without it the
      # gate would fail loudly, so the order is load-bearing.
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        id: hs
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            core/dist-newstyle
          key: cabal-${{ runner.os }}-ghc9.14.1-${{ hashFiles('core/ce-core.cabal', 'core/cabal.project*') }}
      - name: Haskell build + test
        working-directory: core
        run: |
          cabal update
          cabal build all
          cabal test all

      # The interim Haskell file-size gate (E01, 300-line ceiling
      # over core/**/*.hs) retired here (M5-3j): per-file ratchet
      # ceilings in ce-baseline.json now gate core/ via `ce check`,
      # and tests/core_size_gate.rs asserts per file that the
      # replacement is never weaker — and that this step stays gone.

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-19; version comes from cli/rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            gui/src-tauri
      - name: Rust build + test + lint
        shell: bash
        working-directory: cli
        run: |
          # split, not `export X=$(...)`: for a command word the exit
          # status is export's (0), so a failing cabal list-bin under
          # `set -e` exported an EMPTY value and the step marched on to
          # die later on an opaque spawn failure
          CE_CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          [ -n "$CE_CORE_BIN" ] || { echo "cabal list-bin gave nothing"; exit 1; }
          export CE_CORE_BIN
          cargo build --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check

      # M7-P1 + v0.2.0 core legs: the ADR-007 bootstrap chain, nine
      # states (PATH fallback / fresh verified download / warm cache /
      # tampered refusal / pinned ce-core sibling placement / tampered
      # core refusal / failed-download degrade to PATH / mismatching
      # on-disk core refused / ce bound to the pinned path) with the
      # real debug ce as payload over file:// — hermetic on purpose;
      # the https transport is curl's contract.
      - name: Bootstrap chain e2e
        shell: bash
        run: bash .github/scripts/bootstrap_e2e.sh cli/target/debug/ce plugin/bin/ce.sh

      # GUI shell (M6 S4b): compiles on both push platforms so the
      # window can never rot silently. The webview system deps are
      # ubuntu-only (Windows ships WebView2); packaging itself stays
      # a release-tag concern, not a per-push gate.
      - name: GUI system deps (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        # azure.archive.ubuntu.com intermittently black-holes (three
        # runs hung here for hours on 2026-08-19; the armored retry
        # then died differently — every round burned 30s x 4 sources
        # on the dead mirror before apt fell back, and a slow-drip
        # install never tripped the read timeout, so ONE attempt ate
        # the whole step budget). So: point the runner's mirrorlist
        # (the file:/etc/apt/apt-mirrors.txt the sources consume, per
        # the failing run's own log) straight at the archive that DID
        # answer, cap each try with timeout(1), and keep the step
        # timeout as the hard floor. The sleep is retry backoff.
        timeout-minutes: 15
        run: |
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          ok=""
          for i in 1 2 3; do
            if timeout 120 sudo apt-get $APT update && timeout 420 sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev; then ok=1; break; fi
            echo "apt attempt $i failed; backing off" && sleep 10
          done
          [ -n "$ok" ]
      - name: GUI build + lint
        shell: bash
        working-directory: gui/src-tauri
        run: |
          cargo build --locked
          cargo clippy --locked -- -D warnings
          cargo fmt --check

      # gui/ui/*.js enters only the size-only scan arm (v0.5.0), never
      # the judgment families, so the two structure lenses still need a
      # semantic gate of their own — a fold that hid findings shipped.
      # This one runs the real module over a boundary fixture; it
      # carries its own non-emptiness assertion.
      - name: GUI lens invariant
        shell: bash
        run: node gui/tests/lens_invariant.js

      # Dogfood (plan §7.5): this repo must pass its own scanner
      # (exit 1 on fail-level findings), its own clone ratchet
      # (R12: blocks must not exceed the ce.toml [dedup] budget), the
      # ADR-006 baseline gate WITH its floor leg live (M5-close audit
      # D5: --fail-under 800 = collapse floor 66‰ under the measured
      # 866-872 band, decided not derived), the deadcode zero-dead
      # gate and the docdup zero-report gate (audit D6/D9: the
      # "全处置" acceptance rows were discipline-only before).
      - name: Dogfood (scan + dedup ratchet + check floor + deadcode + docdup)
        shell: bash
        working-directory: cli
        run: |
          CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          cargo run --locked -- scan .. --core "$CORE_BIN"
          cargo run --locked -- dedup .. --check --core "$CORE_BIN"
          cargo run --locked -- check .. --core "$CORE_BIN" --fail-under 800
          cargo run --locked -- deadcode .. --core "$CORE_BIN" --check
          cargo run --locked -- docdup .. --core "$CORE_BIN" --check

      # The churn axis (score axis 5) needs the git-subprocess walk —
      # 216s measured locally at --days 14, so it runs on ONE matrix
      # leg instead of dying structurally on all of them (audit D5:
      # opts.days was never set anywhere in CI).
      - name: Dogfood churn leg (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: cli
        run: |
          cargo run --locked -- check .. --core "$(cd ../core && cabal list-bin ce-core)" --fail-under 800 --days 14

      - name: Handshake smoke (ce doctor)
        shell: bash
        working-directory: cli
        run: |
          CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          # ".." = report on the repo root, not cli/ (doctor no longer
          # spawns a daemon, so nothing lingers holding the exe)
          cargo run --locked -- doctor --core "$CORE_BIN" ..

  build-macos:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # graph_provenance.rs ancestry, same as above
      # The GHC toolchain itself is cached: macOS images ship no
      # preinstalled 9.14.1 (ubuntu/windows do), so every run used to
      # download the tarball from downloads.haskell.org — a single
      # point of failure measured in full on 2026-08-19 (haskell.org
      # data-corruption outage, four red reruns). On a hit ghcup finds
      # the install locally and never touches the origin.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ghcup
          key: ghcup-macos-ghc9.14.1
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"
      - name: Haskell build + test
        working-directory: core
        run: |
          cabal update
          cabal build all
          cabal test all
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-19
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            gui/src-tauri
      - name: Rust build + test
        shell: bash
        working-directory: cli
        run: |
          # split, not `export X=$(...)`: for a command word the exit
          # status is export's (0), so a failing cabal list-bin under
          # `set -e` exported an EMPTY value and the step marched on to
          # die later on an opaque spawn failure
          CE_CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          [ -n "$CE_CORE_BIN" ] || { echo "cabal list-bin gave nothing"; exit 1; }
          export CE_CORE_BIN
          cargo build --locked
          cargo test --locked
      - name: Bootstrap chain e2e (macOS leg)
        shell: bash
        run: bash .github/scripts/bootstrap_e2e.sh cli/target/debug/ce plugin/bin/ce.sh
      - name: GUI build (macOS coverage)
        shell: bash
        working-directory: gui/src-tauri
        run: cargo build --locked
