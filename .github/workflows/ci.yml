# CI per DEVELOPMENT_PLAN.md §6 M0. The repository is public (2026-08-28),
# so Actions minutes are free and the macOS leg runs on every push like
# the other two (plan v2.29 step 9; it was tag + weekly while the repo
# was private and macOS 10x-metered, D2-8). The weekly schedule carries
# the jobs that must reach the real network — starter-https,
# setup-wiring, packaging-live — and the five-target release rehearsal;
# workflow_dispatch runs them on demand. Every job that never runs on a
# push is named in release.yml's SKIPPED_OK (its skipped check on the
# tag commit would refuse the publish otherwise; tests/it/release_roster.rs).
name: ci

# CI never writes repo CONTENTS back — said explicitly so the token
# the third-party build scripts see is read-only whatever the repo
# default. The build job alone adds security-events: write, which is
# the SARIF upload lane (code-scanning alerts), not a contents write.
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly: the network legs against the live release and the live Claude Code, the five-target release rehearsal, plus one more macOS run
  workflow_dispatch: # the network legs and the rehearsal, on demand

# A newer push to the same ref supersedes the in-flight run (billing:
# rapid push trains used to bill every intermediate tree in full).
# The event name is part of the group so a branch push can never
# cancel the weekly schedule run, and tag refs are their own groups.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      security-events: write # the SARIF upload step below, nothing else
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # graph_provenance.rs asserts sample -> audit -> resolver
          # commit ancestry (design G13); a shallow clone has no
          # ancestry to check and the test refuses it loudly
          fetch-depth: 0
          # the suite is the cli/tests submodule (skymanbp/CodeEraser-tests,
          # plan v2.18): without it cargo has no tests and the self-score
          # would judge a tree without them
          submodules: true

      # Haskell first: the Rust test step consumes the built ce-core
      # via CE_CORE_BIN (cross-language wire goldens) — without it the
      # gate would fail loudly, so the order is load-bearing.
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        id: hs
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            core/dist-newstyle
          key: cabal-${{ runner.os }}-ghc9.14.1-${{ hashFiles('core/ce-core.cabal', 'core/cabal.project*') }}
      - name: Haskell build + test
        working-directory: core
        run: |
          cabal update
          cabal build all
          cabal test all

      # The interim Haskell file-size gate (E01, 300-line ceiling
      # over core/**/*.hs) retired here (M5-3j): per-file ratchet
      # ceilings in ce-baseline.json now gate core/ via `ce check`,
      # and tests/core_size_gate.rs asserts per file that the
      # replacement is never weaker — and that this step stays gone.

      # The two README/site diagrams are rendered from one pinned archify
      # commit kept in the ignored cargo target dir (plan v2.21): the
      # docs_diagrams gate refuses by name when the cache is absent.
      - name: archify cache (pinned)
        run: node scripts/diagram.mjs --fetch
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-19; version comes from rust-toolchain.toml (repo root, both workspaces)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            gui/src-tauri
      - name: Rust build + test + lint
        shell: bash
        working-directory: cli
        run: |
          # split, not `export X=$(...)`: for a command word the exit
          # status is export's (0), so a failing cabal list-bin under
          # `set -e` exported an EMPTY value and the step marched on to
          # die later on an opaque spawn failure
          CE_CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          [ -n "$CE_CORE_BIN" ] || { echo "cabal list-bin gave nothing"; exit 1; }
          export CE_CORE_BIN
          cargo build --locked
          # The packaged crate must compile its own tests: cfg(test)
          # mounts tests/unit/** by #[path] (plan v2.18 step #13) and
          # `cargo publish`'s verify build never enables cfg(test), so
          # only a check of the extracted tarball can see a mount the
          # tarball lacks. The build dir is shared so the dependency
          # artifacts above are reused: package's own verify build (the
          # one `cargo publish` runs) and the check both re-do only the
          # crate itself. It runs BEFORE the tests because the shared
          # verify build rewrites target/debug/ce.exe, and a lazily
          # started `ce daemon` that outlived its test's teardown holds
          # that exe open until its idle exit — on Windows the rewrite
          # then fails with "Access is denied" (runs 33227318755 /
          # 33232925443, L step #15; the e2e legs were blamed first —
          # the census below named the real holder, step #16).
          CARGO_TARGET_DIR="$PWD/target" cargo package --locked --allow-dirty
          crate=$(ls target/package/codeeraser-*.crate)
          tar -xzf "$crate" -C target/package
          (cd "${crate%.crate}" && CARGO_TARGET_DIR="$OLDPWD/target" cargo check --locked --tests)
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check

      # M7-P1 + v0.2.0 core legs: the ADR-007 bootstrap chain, seventeen
      # states (PATH fallback / fresh verified download / warm cache /
      # tampered refusal / pinned ce-core sibling placement / tampered
      # core refusal / failed-download degrade to PATH / mismatching
      # on-disk core refused / ce bound to the pinned path / pin-identical
      # PATH ce reused / pin-identical PATH ce-core reused / the four
      # session-stamp laws of L round step #15 O52 / a hand-placed copy
      # verified or refused by name, O79) with the real debug ce as
      # payload over file:// — hermetic on purpose; the https transport
      # is curl's contract, exercised for real by the weekly
      # starter-https job below.
      - name: Bootstrap chain e2e
        shell: bash
        run: bash .github/scripts/bootstrap_e2e.sh cli/target/debug/ce plugin/bin/ce.sh

      # GUI shell (M6 S4b): compiles on both push platforms so the
      # window can never rot silently. The webview system deps are
      # ubuntu-only (Windows ships WebView2); packaging itself stays
      # a release-tag concern, not a per-push gate.
      - name: GUI system deps (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        # azure.archive.ubuntu.com intermittently black-holes (three
        # runs hung here for hours on 2026-08-19; the armored retry
        # then died differently — every round burned 30s x 4 sources
        # on the dead mirror before apt fell back, and a slow-drip
        # install never tripped the read timeout, so ONE attempt ate
        # the whole step budget). So: point the runner's mirrorlist
        # (the file:/etc/apt/apt-mirrors.txt the sources consume, per
        # the failing run's own log) straight at the archive that DID
        # answer, cap each try with timeout(1), and keep the step
        # timeout as the hard floor. The sleep is retry backoff.
        timeout-minutes: 15
        run: |
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          ok=""
          for i in 1 2 3; do
            if timeout 120 sudo apt-get $APT update && timeout 420 sudo apt-get $APT install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev; then ok=1; break; fi
            echo "apt attempt $i failed; backing off" && sleep 10
          done
          [ -n "$ok" ]
      - name: GUI build + lint
        shell: bash
        working-directory: gui/src-tauri
        run: |
          cargo build --locked
          cargo clippy --locked -- -D warnings
          cargo fmt --check

      # gui/ui/*.js enters only the size-only scan arm (v0.5.0), never
      # the judgment families, so the two structure lenses still need a
      # semantic gate of their own — a fold that hid findings shipped.
      # This one runs the real module over a boundary fixture; it
      # carries its own non-emptiness assertion.
      - name: GUI lens invariant
        shell: bash
        run: node cli/tests/gui/lens_invariant.js
      # the zh table had no gate while the CLI's reddens on a missing
      # OR dead key — tr() renders an absent key as the literal string
      # "undefined", silently (audit 2026-08-21)
      - name: GUI i18n gate (both-directions completeness)
        run: node cli/tests/gui/i18n_gate.js
      # the hub keeps a report row's first five scalar columns; the
      # advisory row of ce.deadcode-report/0.3.0 has exactly five and
      # the symbol is the fourth — K44 pins that the projection keeps
      # it (the Rust half pins the key order in deadcode_e2e)
      - name: GUI hub projection (K44)
        run: node cli/tests/gui/hub_projection.js
      # the installer's Claude Code wiring is exercised only when a
      # human runs the NSIS bundle on a machine with Claude Code —
      # which CI never is, and which is how the passive lane died for
      # three days when 9f86d58 moved the marketplace manifest and the
      # registration kept pointing at plugin/ (a silent cache miss).
      # This leg pins the static half of that chain: the hook delegates
      # to `ce setup` (and `--unwire`, on the same marker), and every
      # name `ce setup` spells resolves against the repository it ships
      # from. The dynamic half — the real Claude Code adding the
      # marketplace and installing — is the weekly setup-wiring job.
      # Full packaging stays a release-phase concern (the draft build
      # compiles the real bundle).
      - name: Installer wiring invariants
        run: node cli/tests/gui/installer_wiring.js

      # Dogfood (plan §7.5): this repo must pass its own scanner
      # (exit 1 on fail-level findings), its own clone ratchet
      # (R12: blocks must not exceed the ce.toml [dedup] budget), the
      # ADR-006 baseline gate WITH its floor leg live (M5-close audit
      # D5: the floor is a collapse floor, decided not derived. 800
      # held ~6-13‰ of headroom over the v0.6-era 806-813 band; the
      # proto-2.17.0 density scoring (M9 batch 6) re-priced the self
      # score to 953, and the floor re-anchors at 950 to keep the
      # SAME bite — it fires on collapse, not drift. Plan v2.18 step
      # #12 (2026-08-28) made the test suite a READER of this tree:
      # 120 files left the measured universe, the module-cycle share
      # among what remains rose, the self score re-priced 952 → 943
      # and the floor re-anchors at 940 — same bite again. Step #13
      # (same day) moved every #[cfg(test)] module into the submodule
      # too: 6.1k more lines left the universe, the cycle share fell,
      # the self score re-priced 943 → 949 and the floor sat at 946.
      # Plan v2.29 step 8 (proto 7.0.0) re-denominated the clone axis
      # over code files (files touched, not pairs): 949 → 943, and
      # the floor re-anchors at 939 — the same bite once more.
      # Also the deadcode zero-dead
      # gate and the docdup zero-report gate (audit D6/D9: the
      # "全处置" acceptance rows were discipline-only before), and the
      # erase zero-row gate (erase.md acceptance: this repository
      # keeps itself clean — a non-empty self-plan is a red gate).
      # Who still runs the binary before the relink. Prints, never
      # kills: on 2026-08-29 it named the holder behind the "Access is
      # denied" relink (af45fcf, twice, every test green) — a guard
      # test's daemon at a DELEGATED submodule root, which the hook
      # runner's teardown never asked (run 33262869599; fixed in the
      # suite's shutdown_daemon). Kept standing so the next holder is
      # named, not guessed.
      - name: Process census before the relink
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.CommandLine -like '*CodeEraser*' } | Select-Object ProcessId,ParentProcessId,Name,CreationDate,CommandLine | Format-List | Out-String -Width 400"; else ps -eo pid,ppid,etime,cmd | grep -i codeeraser | grep -v grep || true; fi
      - name: Dogfood (scan + dedup ratchet + check floor + deadcode + docdup + erase)
        shell: bash
        working-directory: cli
        run: |
          CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          cargo run --locked -- scan .. --core "$CORE_BIN"
          cargo run --locked -- dedup .. --check --core "$CORE_BIN"
          cargo run --locked -- check .. --core "$CORE_BIN" --fail-under 939
          cargo run --locked -- deadcode .. --core "$CORE_BIN" --check
          cargo run --locked -- docdup .. --core "$CORE_BIN" --check
          cargo run --locked -- erase .. --core "$CORE_BIN" --check

      # The test suite is a READER of this tree (plan v2.18 step #12):
      # its files feed the graph's edges and the advisory's mention
      # universe above and are measured by nobody there. What measures
      # them is the submodule's own ce.toml + baseline — the same six
      # gates, rooted at cli/tests (root resolution stops at its
      # ce.toml). 978 at the split, floor 975: the same bite; 987 once
      # the crate's unit tests rode in as unit/ (step #13), floor 983;
      # 983 once the clone axis re-denominated (v2.29 step 8), floor 979.
      - name: Dogfood the test suite (its own ce.toml + baseline)
        shell: bash
        working-directory: cli
        run: |
          CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          cargo run --locked -- scan tests --core "$CORE_BIN"
          cargo run --locked -- dedup tests --check --core "$CORE_BIN"
          cargo run --locked -- check tests --core "$CORE_BIN" --fail-under 979
          cargo run --locked -- deadcode tests --core "$CORE_BIN" --check
          cargo run --locked -- docdup tests --core "$CORE_BIN" --check
          cargo run --locked -- erase tests --core "$CORE_BIN" --check

      # The churn axis (score axis 5) needs the git-subprocess walk —
      # 216s measured locally at --days 14, so it runs on ONE matrix
      # leg instead of dying structurally on all of them (audit D5:
      # opts.days was never set anywhere in CI). NO floor here (user
      # ruling 2026-08-21): the churn axis prices RECENT edits, so any
      # legitimate large landing dips this leg below a copied floor
      # for up to 14 days — drift-shaped, exactly what the base leg's
      # floor comment says it must NOT bite on. Claims stay single:
      # the base leg owns the score floor, this leg owns the churn
      # measurement path plus the ratchet (still armed, still fatal).
      - name: Dogfood churn leg (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: cli
        run: |
          cargo run --locked -- check .. --core "$(cd ../core && cabal list-bin ce-core)" --days 14

      # The SARIF distribution face (plan v2.14: the revival's stated
      # benefit IS this lane): the same judged scan findings the
      # dogfood step just gated on, re-encoded and uploaded so the
      # accepted-warn backlog is visible as code-scanning alerts with
      # per-file history. Main-push only — fork PRs lack the token
      # scope, and tags/schedule add nothing over the push that made
      # them. Runs after the dogfood gate on purpose: a red tree
      # fails the job before this step, so alerts always describe a
      # tree the gates accepted.
      - name: SARIF upload (scan findings -> code scanning)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: cli
        run: cargo run --locked -- scan .. --core "$(cd ../core && cabal list-bin ce-core)" --format sarif > ../ce-scan.sarif
      - name: SARIF upload (publish)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4, pinned 2026-08-25
        with:
          sarif_file: ce-scan.sarif
          category: ce-scan
      # The second SARIF lane (O81): `ce dedup --format sarif` has existed
      # since plan v2.14 and nothing consumed it — the verified clone
      # blocks the dogfood gate accepted are alerts too now, under their
      # own category so the two families never overwrite each other.
      - name: SARIF upload (dedup findings -> code scanning)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: cli
        run: cargo run --locked -- dedup .. --core "$(cd ../core && cabal list-bin ce-core)" --format sarif > ../ce-dedup.sarif
      - name: SARIF upload (dedup publish)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4, pinned 2026-08-25
        with:
          sarif_file: ce-dedup.sarif
          category: ce-dedup

      - name: Handshake smoke (ce doctor)
        shell: bash
        working-directory: cli
        run: |
          CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          # ".." = report on the repo root, not cli/ (doctor no longer
          # spawns a daemon, so nothing lingers holding the exe)
          cargo run --locked -- doctor --core "$CORE_BIN" ..

  # Every push since plan v2.29 step 9 (C-macOS): the repository is
  # public and the minutes free, and the tag-plus-weekly cadence meant
  # the release night was the first time weeks of pushes met a Mac
  # (v1.3.0's first tag run went red exactly there).
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # graph_provenance.rs ancestry, same as above
          submodules: true # cli/tests, same as above
      # The GHC toolchain itself is cached: macOS images ship no
      # preinstalled 9.14.1 (ubuntu/windows do), so every run used to
      # download the tarball from downloads.haskell.org — a single
      # point of failure measured in full on 2026-08-19 (haskell.org
      # data-corruption outage, four red reruns). On a hit ghcup finds
      # the install locally and never touches the origin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghcup
          key: ghcup-macos-ghc9.14.1
      - uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "latest"
      - name: Haskell build + test
        working-directory: core
        run: |
          cabal update
          cabal build all
          cabal test all
      # The two README/site diagrams are rendered from one pinned archify
      # commit kept in the ignored cargo target dir (plan v2.21): the
      # docs_diagrams gate refuses by name when the cache is absent.
      - name: archify cache (pinned)
        run: node scripts/diagram.mjs --fetch
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-19; version comes from rust-toolchain.toml (repo root)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            cli
            gui/src-tauri
      # Same roster as the push matrix (K step 10): this leg used to
      # run build+test only, so a macOS-only clippy lint, a formatting
      # drift, a dogfood red or a webview-gate break surfaced at the
      # worst possible moment — the release-tag run, which used to be
      # the first time this leg fired after weeks of pushes. The v1.0.0
      # release-night daemon corpse was exactly this class of late
      # discovery; the leg now runs on every push (job header).
      - name: Rust build + test + lint
        shell: bash
        working-directory: cli
        run: |
          # split, not `export X=$(...)`: for a command word the exit
          # status is export's (0), so a failing cabal list-bin under
          # `set -e` exported an EMPTY value and the step marched on to
          # die later on an opaque spawn failure
          CE_CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          [ -n "$CE_CORE_BIN" ] || { echo "cabal list-bin gave nothing"; exit 1; }
          export CE_CORE_BIN
          cargo build --locked
          # The packaged crate must compile its own tests: cfg(test)
          # mounts tests/unit/** by #[path] (plan v2.18 step #13) and
          # `cargo publish`'s verify build never enables cfg(test), so
          # only a check of the extracted tarball can see a mount the
          # tarball lacks. The build dir is shared so the dependency
          # artifacts above are reused: package's own verify build (the
          # one `cargo publish` runs) and the check both re-do only the
          # crate itself. It runs BEFORE the tests because the shared
          # verify build rewrites target/debug/ce.exe, and a lazily
          # started `ce daemon` that outlived its test's teardown holds
          # that exe open until its idle exit — on Windows the rewrite
          # then fails with "Access is denied" (runs 33227318755 /
          # 33232925443, L step #15; the e2e legs were blamed first —
          # the census below named the real holder, step #16).
          CARGO_TARGET_DIR="$PWD/target" cargo package --locked --allow-dirty
          crate=$(ls target/package/codeeraser-*.crate)
          tar -xzf "$crate" -C target/package
          (cd "${crate%.crate}" && CARGO_TARGET_DIR="$OLDPWD/target" cargo check --locked --tests)
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --check
      - name: Bootstrap chain e2e (macOS leg)
        shell: bash
        run: bash .github/scripts/bootstrap_e2e.sh cli/target/debug/ce plugin/bin/ce.sh
      - name: GUI build + lint (macOS coverage)
        shell: bash
        working-directory: gui/src-tauri
        run: |
          cargo build --locked
          cargo clippy --locked -- -D warnings
          cargo fmt --check
      - name: GUI webview gates (macOS coverage)
        shell: bash
        run: |
          node cli/tests/gui/lens_invariant.js
          node cli/tests/gui/i18n_gate.js
          node cli/tests/gui/hub_projection.js
          node cli/tests/gui/installer_wiring.js
      - name: Dogfood (macOS coverage — the six self-gates)
        shell: bash
        working-directory: cli
        run: |
          CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          cargo run --locked -- scan .. --core "$CORE_BIN"
          cargo run --locked -- dedup .. --check --core "$CORE_BIN"
          cargo run --locked -- check .. --core "$CORE_BIN" --fail-under 939
          cargo run --locked -- deadcode .. --core "$CORE_BIN" --check
          cargo run --locked -- docdup .. --core "$CORE_BIN" --check
          cargo run --locked -- erase .. --core "$CORE_BIN" --check

      # The test suite is a READER of this tree (plan v2.18 step #12):
      # its files feed the graph's edges and the advisory's mention
      # universe above and are measured by nobody there. What measures
      # them is the submodule's own ce.toml + baseline — the same six
      # gates, rooted at cli/tests (root resolution stops at its
      # ce.toml). 978 at the split, floor 975: the same bite; 987 once
      # the crate's unit tests rode in as unit/ (step #13), floor 983;
      # 983 once the clone axis re-denominated (v2.29 step 8), floor 979.
      - name: Dogfood the test suite (macOS coverage)
        shell: bash
        working-directory: cli
        run: |
          CORE_BIN=$(cd ../core && cabal list-bin ce-core)
          cargo run --locked -- scan tests --core "$CORE_BIN"
          cargo run --locked -- dedup tests --check --core "$CORE_BIN"
          cargo run --locked -- check tests --core "$CORE_BIN" --fail-under 979
          cargo run --locked -- deadcode tests --core "$CORE_BIN" --check
          cargo run --locked -- docdup tests --core "$CORE_BIN" --check
          cargo run --locked -- erase tests --core "$CORE_BIN" --check

  # The real transport (O78): every other leg feeds the starter file://
  # URLs, so the https download — curl's flags, the redirect GitHub
  # answers with, the pinned bytes actually served — ran only on users'
  # machines. Weekly, against the committed manifest and the live
  # release it names: the starter must fetch both binaries over https,
  # verify them against the pins, exec ce silently, stamp the verified
  # leg, and the doctor must then reach the downloaded core.
  starter-https:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Starter over https against the committed pins
        shell: bash
        run: |
          . plugin/bin/manifest.env
          data="$RUNNER_TEMP/plugin-data"
          out=$(CLAUDE_PLUGIN_DATA="$data" sh plugin/bin/ce.sh --version 2>"$RUNNER_TEMP/starter.err")
          err=$(cat "$RUNNER_TEMP/starter.err")
          [ -z "$err" ] || { echo "the verified leg was not silent: $err"; exit 1; }
          [ "$out" = "ce $CE_MANIFEST_VERSION" ] || { echo "starter answered '$out', the manifest says $CE_MANIFEST_VERSION"; exit 1; }
          [ -f "$data/bound-$CE_MANIFEST_VERSION.env" ] || { echo "the verified leg left no stamp"; exit 1; }
          [ -x "$data/ce-core" ] || { echo "the pinned ce-core was not placed"; exit 1; }
          CLAUDE_PLUGIN_DATA="$data" sh plugin/bin/ce.sh doctor . | tee "$RUNNER_TEMP/doctor.out"
          grep -q "handshake: OK" "$RUNNER_TEMP/doctor.out" || { echo "doctor did not reach the downloaded core"; exit 1; }

  # `ce setup` against the REAL Claude Code (O72 / O82, plan v2.29 step
  # 10). The e2e legs drive a scripted fake `claude`; the one question
  # a fake cannot answer is whether the real CLI, signed in to nothing,
  # adds skymanbp/CodeEraser@release and installs codeeraser@codeeraser
  # — it does (first-party 2026-09-05 against an empty CLAUDE_CONFIG_DIR:
  # added, installed, kept on the second run, unwired clean), and this
  # leg keeps that true on both installer platforms as Claude Code
  # moves. Weekly like starter-https, and on demand.
  setup-wiring:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (no submodule: only the binary is built here)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned 2026-08-19; version comes from rust-toolchain.toml (repo root)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
      - name: Build ce
        working-directory: cli
        run: cargo build --locked --bin ce
      - name: Install Claude Code (npm)
        run: npm install -g @anthropic-ai/claude-code
      - name: ce setup wires, keeps, unwires against the real claude
        shell: bash
        run: |
          # an empty config dir: no account, no prior marketplaces — the
          # installer's situation on a fresh machine
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-config"
          mkdir -p "$CLAUDE_CONFIG_DIR" "$RUNNER_TEMP/marker" "$RUNNER_TEMP/marker2"
          ce=cli/target/debug/ce; [ "$RUNNER_OS" != Windows ] || ce="$ce.exe"
          # npm's claude is a .cmd shim on Windows: bash cannot exec it, cmd can
          cl() { if [ "$RUNNER_OS" = Windows ]; then cmd //c claude "$@"; else claude "$@"; fi; }
          cl --version
          "$ce" setup --format json --marker-dir "$RUNNER_TEMP/marker" | tee "$RUNNER_TEMP/wire.json"
          jq -e '.exit == 0 and .marketplace.state == "added" and .plugin.state == "installed" and .marker.after == true' "$RUNNER_TEMP/wire.json"
          cl plugin marketplace list --json | jq -e 'map(select(.name == "codeeraser" and .ref == "release")) | length == 1'
          cl plugin list | grep -F codeeraser@codeeraser
          # a second run keeps the registration (5) and writes no marker
          rc=0; "$ce" setup --format json --marker-dir "$RUNNER_TEMP/marker2" > "$RUNNER_TEMP/kept.json" || rc=$?
          [ "$rc" = 5 ] || { echo "second setup exited $rc, expected 5: $(cat "$RUNNER_TEMP/kept.json")"; exit 1; }
          jq -e '.marketplace.state == "present" and .marker.after == false' "$RUNNER_TEMP/kept.json"
          # --unwire removes exactly what the first run added
          "$ce" setup --unwire --format json --marker-dir "$RUNNER_TEMP/marker" | tee "$RUNNER_TEMP/unwire.json"
          jq -e '.exit == 0 and .plugin.state == "uninstalled" and .marketplace.state == "removed" and .marker.after == false' "$RUNNER_TEMP/unwire.json"
          cl plugin marketplace list --json | jq -e 'map(select(.name == "codeeraser")) | length == 0'

  # The release build, rehearsed (plan v2.29 step 10, O70): the five
  # roster targets through the SAME reusable workflow release.yml's
  # build matrix calls — ce, ce-core and the GUI bundle with sidecars on
  # the runner image the release will use — without uploading. A runner
  # image, GHC bindist or bundler break on a target then surfaces
  # weekly and on demand, not on the tag (the v1.3.0 lesson, now for
  # five targets). The matrix rows are the roster
  # (tests/it/release_roster.rs holds them to update::version::TARGETS).
  release-rehearsal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, key: x86_64-windows, triple: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: ubuntu-latest, key: x86_64-linux, triple: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, key: aarch64-macos, triple: aarch64-apple-darwin, ext: "" }
          - { os: macos-15-intel, key: x86_64-macos, triple: x86_64-apple-darwin, ext: "" }
          - { os: ubuntu-24.04-arm, key: aarch64-linux, triple: aarch64-unknown-linux-gnu, ext: "" }
    uses: ./.github/workflows/build-target.yml
    with:
      os: ${{ matrix.os }}
      key: ${{ matrix.key }}
      triple: ${{ matrix.triple }}
      ext: ${{ matrix.ext }}
      version: ""
      upload: false

  # The package-manager projections against the live release (O71):
  # the generated formula must install from the pinned assets on both
  # Homebrew platforms and pass Homebrew's own style and audit, and the
  # winget manifests must validate against Microsoft's schema for the
  # version they declare. tests/it/packaging.rs holds the files to the
  # manifest byte by byte; this leg is the one reader that is not us.
  packaging-live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Homebrew formula — style, audit, install from the pins, test
        shell: bash
        run: |
          . plugin/bin/manifest.env
          f=packaging/homebrew/Formula/codeeraser.rb
          brew style --formula "$f"
          brew audit --formula --strict "$f"
          brew install --formula "$f"
          got=$(ce --version)
          [ "$got" = "ce $CE_MANIFEST_VERSION" ] || { echo "formula installed '$got', the manifest pins $CE_MANIFEST_VERSION"; exit 1; }
          ce-core --version
          brew test codeeraser
      - name: winget manifests validate against the declared schema
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # the directory the manifest names, never the first one sorted:
          # a stale sibling would otherwise validate in the release's place
          . plugin/bin/manifest.env
          dir=packaging/winget/manifests/s/skymanbp/CodeEraser/$CE_MANIFEST_VERSION
          [ -d "$dir" ] || { echo "$dir is missing — run node scripts/packaging.js"; exit 1; }
          v=$(sed -n 's/^ManifestVersion: //p' "$dir/skymanbp.CodeEraser.yaml")
          for kind in version installer defaultLocale; do
            case "$kind" in
              version) file="$dir/skymanbp.CodeEraser.yaml" ;;
              installer) file="$dir/skymanbp.CodeEraser.installer.yaml" ;;
              defaultLocale) file="$dir/skymanbp.CodeEraser.locale.en-US.yaml" ;;
            esac
            pipx run check-jsonschema==0.38.0 --schemafile "https://aka.ms/winget-manifest.$kind.$v.schema.json" "$file"
          done
